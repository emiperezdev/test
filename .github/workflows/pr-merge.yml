name: PR Merge Notification

on:
  push:
    branches:
      - main
      - staging

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification on PR Merge
        id: telegram
        run: |
          # Verificar si el commit es un merge
          if [[ "${GITHUB_SHA}" != "$(git rev-parse --verify MERGE_HEAD)" ]]; then
            exit 0
          fi

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=PR Merge Notification. Repository: J1Connect. Branch: ${{ github.ref }}. Merge Commit: ${{ github.sha }}. Merge URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
