name: PR Merge Notification

on:
  push:
    branches:
      - main
      - staging

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification on PR Merge
        id: telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=PR Merge Notification!!%0A%0ARepository: J1Connect.%0ABranch: ${{ github.ref_name }}.%0AMerge Commit: ${{ github.sha }}.%0AMerge URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
          -d "message_thread_id=2"
