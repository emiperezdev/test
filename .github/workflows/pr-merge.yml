name: PR Merge Notification

on:
  push:
    branches:
      - main
      - staging

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check if push is a merge and send notification
        id: check_merge
        run: |
          # Verificar si el push es un merge (esto se puede deducir si el commit tiene más de un padre)
          COMMIT_HASH=$(git log -1 --pretty=%H)
          PARENT_COUNT=$(git log --pretty=%P -n 1 $COMMIT_HASH | wc -w)

          # Si el commit tiene más de un padre, es un merge
          if [ "$PARENT_COUNT" -gt 1 ]; then
            # Enviar la notificación de merge
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=PR Merge Notification. Repository: J1Connect. Branch: ${{ github.ref }}. Merge Commit: ${{ github.sha }}. Merge URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          else
            echo "No es un commit de merge, terminando."
            exit 0
          fi
