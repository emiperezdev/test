name: PR Review Request Notification

on:
  pull_request:
    types:
      - review_requested
      - ready_for_review
      - opened
      - edited
      - reopened
    branches:
      - main
      - staging

jobs:
  send_notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification on PR Action
        id: telegram
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}!!%0A%0A"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}%0A"
          PR_URL="${{ github.event.pull_request.html_url }}%0A"
          PR_ACTION="${{ github.event.action }}%0A"
          MESSAGE_THREAD_ID="2"  # El ID del hilo del mensaje que deseas usar

          if [ "$PR_ACTION" == "review_requested" ]; then
            MESSAGE="PR review_requested occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          elif [ "$PR_ACTION" == "ready_for_review" ]; then
            MESSAGE="PR ready_for_review occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          elif [ "$PR_ACTION" == "opened" ]; then
            MESSAGE="PR opened occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          elif [ "$PR_ACTION" == "edited" ]; then
            MESSAGE="PR edited occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          elif [ "$PR_ACTION" == "reopened" ]; then
            MESSAGE="PR reopened occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          else
            MESSAGE="PR action occurred!!%0A%0ARepository: J1Connect.%0APR Title: $PR_TITLE.%0APR Author: $PR_AUTHOR.%0APR URL: $PR_URL"
          fi

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=$MESSAGE" \
          -d "message_thread_id=$MESSAGE_THREAD_ID"
